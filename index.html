<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Jmom Financial</title>
  <script>try{var t=localStorage.getItem("jmTheme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kantumruy+Pro:wght@400;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <style>
    :root {
      --head1:#0F172A; --head2:#1E293B; --accent:#0F766E; --accent2:#14B8A6; --accent-soft:#CCFBF1;
      --bal1:#0F766E; --bal2:#115E59;
      --pos:#059669; --pos-bg:#D1FAE5; --neg:#E11D48; --neg-bg:#FFE4E6; --amber:#D97706; --indigo:#4F46E5;
      --bg:#F1F5F9; --card:#FFFFFF; --text:#0F172A; --muted:#64748B; --line:#E2E8F0; --hl:#F0FDFA;
      --shadow:0 1px 2px rgba(15,23,42,.06),0 1px 8px rgba(15,23,42,.04); --grid:#EEF2F6;
    }
    /* no colour chosen yet → follow the phone (light / dark) */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) { --head1:#020617; --head2:#0F172A; --bg:#0B1120; --card:#111827; --text:#E5E7EB; --muted:#94A3B8; --line:#1F2937;
              --pos:#34D399; --pos-bg:#064E3B; --neg:#FB7185; --neg-bg:#4C1D2B; --hl:#0F2E2A; --accent-soft:#134E4A;
              --shadow:none; --grid:#1F2937; }
    }
    /* colour themes (circles in the header) */
    :root[data-theme="navy"]    { --head1:#0B1F3A; --head2:#123A6B; --accent:#1D4ED8; --accent2:#60A5FA; --bal1:#1E40AF; --bal2:#1E3A8A; --accent-soft:#DBEAFE; --hl:#EFF6FF; }
    :root[data-theme="emerald"] { --head1:#052E2B; --head2:#064E3B; --accent:#047857; --accent2:#34D399; --bal1:#059669; --bal2:#047857; --accent-soft:#D1FAE5; --hl:#ECFDF5; }
    :root[data-theme="plum"]    { --head1:#1E1B4B; --head2:#312E81; --accent:#6D28D9; --accent2:#A78BFA; --bal1:#7C3AED; --bal2:#5B21B6; --accent-soft:#EDE9FE; --hl:#F5F3FF; --indigo:#DB2777; }
    :root[data-theme="cocoa"]   { --head1:#2B1A10; --head2:#4A2C17; --accent:#B45309; --accent2:#F59E0B; --bal1:#B45309; --bal2:#92400E; --accent-soft:#FEF3C7; --hl:#FFFBEB; --bg:#FAF6F1; --line:#EEE3D6; --grid:#F3EBE1; }
    :root[data-theme="dark"]    { --head1:#020617; --head2:#0F172A; --bg:#0B1120; --card:#111827; --text:#E5E7EB; --muted:#94A3B8; --line:#1F2937;
              --pos:#34D399; --pos-bg:#064E3B; --neg:#FB7185; --neg-bg:#4C1D2B; --hl:#0F2E2A; --accent-soft:#134E4A;
              --shadow:none; --grid:#1F2937; }
    .sw { display: flex; gap: 6px; margin-top: 8px; }
    .sw button { width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); padding: 0; cursor: pointer; }
    .sw button.on { border-color: #fff; transform: scale(1.15); }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, "Kantumruy Pro", -apple-system, "Segoe UI", Roboto, "Noto Sans Khmer", sans-serif;
           background: var(--bg); color: var(--text); font-size: 14px; -webkit-font-smoothing: antialiased; }
    header { background: linear-gradient(160deg, var(--head1), var(--head2)); color: #fff; padding: 14px 16px 0; position: sticky; top: 0; z-index: 2; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    header h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: -.2px; }
    header small { color: #94A3B8; font-size: 11px; }
    .ctrl { display: flex; gap: 6px; margin-top: 12px; }
    select, button.refresh { background: rgba(255,255,255,.08); color: #fff; border: 1px solid rgba(255,255,255,.12); border-radius: 10px;
                             padding: 8px 12px; font-size: 14px; font-family: inherit; }
    button.refresh { width: 38px; height: 38px; padding: 0; font-size: 16px; }
    select { flex: 1; } select option { color: #000; }
    .tabs { display: flex; gap: 4px; margin-top: 10px; }
    .tab { flex: 1; background: transparent; color: #94A3B8; border: 0; padding: 10px 7px; font-family: inherit;
           border-bottom: 2px solid transparent; font-size: 14px; cursor: pointer; }
    .tab.on { color: #fff; border-bottom-color: var(--accent2); font-weight: 600; }
    main { padding: 14px; max-width: 760px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .card { background: var(--card); border-radius: 14px; padding: 12px 14px; border: 1px solid var(--line); box-shadow: var(--shadow); }
    .card .label { color: var(--muted); font-size: 12px; font-weight: 500; }
    .card .value { font-size: 18px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; letter-spacing: -.2px; }
    .card.big { grid-column: 1 / -1; background: linear-gradient(135deg, var(--bal1), var(--bal2)); color: #fff; border: 0;
                box-shadow: 0 6px 18px rgba(15,118,110,.25); padding: 16px; }
    .card.big .label { color: rgba(255,255,255,.75); }
    .card.big .value { font-size: 30px; }
    .card.big .sub { font-size: 12px; opacity: .8; margin-top: 6px; }
    .pos { color: var(--pos); } .neg { color: var(--neg); }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .badge.profit { background: var(--pos-bg); color: var(--pos); }
    .badge.lose { background: var(--neg-bg); color: var(--neg); }
    h2 { font-size: 15px; margin: 16px 2px 8px; font-weight: 700; }
    .filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 10px; }
    .chip { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px; font-family: inherit;
            padding: 6px 13px; font-size: 13px; cursor: pointer; }
    .chip.on { background: var(--text); color: var(--card); border-color: var(--text); }
    input.search { width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); font-family: inherit;
                   background: var(--card); color: var(--text); font-size: 14px; margin-bottom: 8px; outline: none; }
    input.search:focus { border-color: var(--accent2); }
    .item { display: flex; justify-content: space-between; gap: 8px; padding: 11px 12px; background: var(--card);
            border: 1px solid var(--line); border-radius: 12px; margin-bottom: 7px; box-shadow: var(--shadow); }
    .item.dep { border-left: 4px solid var(--pos); } .item.tra { border-left: 4px solid var(--indigo); } .item.cost { border-left: 4px solid var(--amber); }
    .item .desc { font-weight: 600; word-break: break-word; }
    .item .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .item .amt { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 700; }
    .item .amt small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
    .totals { color: var(--muted); font-size: 12px; margin: 4px 2px 8px; }
    .empty, .msg { text-align: center; color: var(--muted); padding: 24px; }
    .month { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow);
             margin-bottom: 9px; cursor: pointer; }
    .month.cur { background: var(--hl); border-color: var(--accent-soft); }
    .month .row1 { display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
    .month .row2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 9px;
                   font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .month .row2 b { display: block; color: var(--text); font-size: 13px; }
    .yeartotal { background: linear-gradient(135deg, var(--head1), var(--head2)); color: #fff; border: 0; cursor: default; }
    .yeartotal .row2, .yeartotal .row2 b { color: #fff; } .yeartotal .row2 { color: #94A3B8; }
    .hidden { display: none; }
    .msg .ico { font-size: 40px; display: block; margin-bottom: 8px; }
    .msg b { display: block; color: var(--text); font-size: 16px; margin-bottom: 6px; }
    .retry { margin-top: 12px; background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 9px 18px; font-size: 14px; }
    /* chart */
    .chartcard { margin-bottom: 4px; }
    .chead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .chead b { font-size: 15px; }
    .seg { display: flex; background: var(--bg); border-radius: 10px; padding: 3px; }
    .seg button { border: 0; background: transparent; color: var(--muted); font-family: inherit; font-size: 12px; padding: 5px 11px; border-radius: 8px; cursor: pointer; }
    .seg button.on { background: var(--card); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }
    .legend { display: flex; gap: 14px; font-size: 11px; color: var(--muted); margin-top: 2px; }
    .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
    svg text { font-family: inherit; }
    .cG { stroke: var(--grid); } .cT { fill: var(--muted); } .cOn { fill: var(--text); }
    .cIn { fill: var(--pos); } .cOut { fill: var(--amber); } .cNet { stroke: var(--indigo); } .cDot { fill: var(--card); stroke: var(--indigo); }
    .cBal { stroke: var(--accent2); } .cArea { fill: var(--accent2); } .cBalDot { fill: var(--card); stroke: var(--accent2); }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <div><h1>📊 Jmom Financial</h1><small id="updated">Loading…</small><div class="sw" id="sw" aria-label="Colour"></div></div>
      <button class="refresh" id="refresh">⟳</button>
    </div>
    <div class="ctrl"><select id="monthSel"></select></div>
    <div class="tabs">
      <button class="tab on" data-tab="month">This month</button>
      <button class="tab" data-tab="all">All months</button>
    </div>
  </header>

  <main>
    <section id="tab-month">
      <div id="summary" class="grid"><div class="card big"><div class="label">Loading…</div></div></div>
      <div id="txbox">
      <div class="card chartcard">
        <div class="chead"><b>📈 6 Months</b><div class="seg" id="seg"><button class="on" data-c="profit">Profit</button><button data-c="balance">Balance</button></div></div>
        <svg id="chart" viewBox="0 0 340 180" width="100%"></svg>
        <div class="legend" id="legend"></div>
      </div>
      <h2>Transactions</h2>
      <div class="filters" id="typeFilters">
        <button class="chip on" data-type="All">All</button>
        <button class="chip" data-type="Deposit">🟢 Deposit</button>
        <button class="chip" data-type="Transfer">🔵 Transfer</button>
        <button class="chip" data-type="Cost">🧾 Cost</button>
        <button class="chip" id="todayChip" data-type="Today">📅 Today</button>
      </div>
      <input class="search" id="search" placeholder="🔍 Search name / note…">
      <div class="totals" id="totals"></div>
      <div id="list"></div>
      </div>
    </section>

    <section id="tab-all" class="hidden">
      <div id="months"></div>
    </section>
  </main>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  var Q = new URLSearchParams(location.search), API = Q.get("api") || "";
  var TG = window.Telegram && Telegram.WebApp;
  var DATA = null, currentMonth = "", typeFilter = "All", chartMode = "profit";
  try { TG.ready(); TG.expand(); } catch (e) {}

  function $(id) { return document.getElementById(id); }
  function fmt(n) { n = Number(n) || 0; return (n < 0 ? "−$" : "$") + Math.abs(n).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2}); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
  function badge(st) { return '<span class="badge ' + (st === "Profit" ? "profit" : "lose") + '">' + st + '</span>'; }

  // a message instead of the numbers (no permission, no internet …)
  function message(ico, title, text, retry) {
    $("updated").textContent = title;
    $("summary").innerHTML = '<div class="msg" style="grid-column:1/-1"><span class="ico">' + ico + '</span><b>' + title + '</b>' + (text || "") +
      (retry ? '<br><button class="retry" onclick="load()">⟳ ព្យាយាមម្តងទៀត</button>' : '') + '</div>';
    $("txbox").classList.add("hidden");
  }

  // ask Apps Script for the numbers – it checks the Telegram ID first
  function load() {
    if (!TG || !TG.initData) return message("📱", "សូមបើកតាម Telegram", "បើកពីប៊ូតុង 📊 Dashboard ក្នុង Bot");
    if (!API) return message("⚙️", "មិនទាន់ភ្ជាប់", "Run connectDashboard ក្នុង Apps Script");
    $("updated").textContent = "Loading…";
    fetch(API + (API.indexOf("?") < 0 ? "?" : "&") + "api=dash", { method: "POST", body: JSON.stringify({ initData: TG.initData }), redirect: "follow" })
      .then(function (r) { return r.json(); })
      .then(function (r) {
        if (r.ok) { DATA = r; if (!currentMonth) currentMonth = r.month; $("txbox").classList.remove("hidden"); return render(); }
        if (r.err === "notallowed") return message("🔒", "គ្មានសិទ្ធិមើល", "Telegram ID របស់អ្នក: <b style='display:inline'>" + esc(r.id) + "</b><br>ថែម ID នេះក្នុង ALLOWED_USER_IDS");
        if (r.err === "auth") return message("⏳", "សូមបើកម្តងទៀត", "បិទទំព័រនេះ ហើយចុច 📊 ក្នុង Bot ម្តងទៀត");
        message("⚠️", "មានបញ្ហា", esc(r.msg || r.err), true);
      })
      .catch(function () { message("📶", "ភ្ជាប់មិនបាន", "ពិនិត្យអ៊ីនធឺណិត ហើយព្យាយាមម្តងទៀត", true); });
  }

  function summaryOf(key) { return DATA.year.filter(function (m) { return m.key === key; })[0] || DATA.year[DATA.year.length - 1]; }

  function render() {
    var d = DATA, s = summaryOf(currentMonth);
    currentMonth = s.key;
    $("updated").textContent = "Updated " + d.updatedAt;

    $("monthSel").innerHTML = d.months.slice().reverse().map(function (m) {
      return '<option value="' + m.key + '"' + (m.key === currentMonth ? " selected" : "") + '>' +
             m.label + (m.key === d.currentMonth ? " (this month)" : "") + '</option>';
    }).join("");

    document.querySelector('.tab[data-tab="month"]').textContent = s.label;
    $("todayChip").classList.toggle("hidden", currentMonth !== d.currentMonth);
    if (currentMonth !== d.currentMonth && typeFilter === "Today") setFilter("All");

    $("summary").innerHTML =
      '<div class="card big"><div class="label">Current Balance (end of ' + s.label + ')</div>' +
        '<div class="value">' + fmt(s.closing) + '</div>' +
        '<div class="sub">Opening ' + fmt(s.opening) + ' · ' + s.count + ' transactions</div></div>' +
      card("Deposit/Capital", fmt(s.deposit)) +
      card("Transfer", fmt(s.transfer)) +
      card("Fee (Income)", fmt(s.feeIncome)) +
      card("Fee (Expense)", fmt(s.feeExpense)) +
      card("Net Profit", '<span class="' + (s.netProfit >= 0 ? "pos" : "neg") + '">' + fmt(s.netProfit) + '</span>') +
      card("Status", badge(s.status));

    renderChart();
    renderList();
    renderMonths();
  }

  // ---- 6-month chart: Profit (Fee In / Fee Out bars + Net line) or Balance (end-of-month line) ----
  function renderChart() {
    var idx = 0; DATA.year.forEach(function (m, i) { if (m.key === currentMonth) idx = i; });
    var ks = DATA.year.slice(Math.max(0, idx - 5), idx + 1);
    var W = 340, H = 180, L = 44, B = 24, T = 12, n = Math.max(ks.length, 6), cw = (W - L - 6) / n;
    var vals = [0];
    ks.forEach(function (m) { if (chartMode === "profit") vals.push(m.feeIncome, m.feeExpense, m.netProfit); else vals.push(m.closing); });
    var hi = Math.max.apply(null, vals), lo = Math.min.apply(null, vals);
    var step = [1,2,5,10,20,50,100,200,500,1000,2000,5000,10000,20000,50000,100000].filter(function (s) { return (hi - lo) / s <= 4; })[0] || 200000;
    var top = Math.ceil(hi / step) * step || step, bot = Math.floor(lo / step) * step;
    var y = function (v) { return T + (H - T - B) * (top - v) / (top - bot); };
    var short = function (v) { return Math.abs(v) >= 1000 ? (v / 1000) + "k" : v; };
    var s = "";
    for (var g = bot; g <= top + 1e-9; g += step)
      s += '<line x1="' + L + '" x2="' + W + '" y1="' + y(g) + '" y2="' + y(g) + '" class="cG"/>' +
           '<text class="cT" x="' + (L - 6) + '" y="' + (y(g) + 4) + '" font-size="10" text-anchor="end">' + short(g) + '</text>';
    var pts = [];
    ks.forEach(function (m, i) {
      var x = L + i * cw + cw / 2, on = m.key === currentMonth, z = y(0), bw = cw * 0.28;
      if (chartMode === "profit") {
        s += '<rect x="' + (x - bw - 1) + '" y="' + Math.min(y(m.feeIncome), z) + '" width="' + bw + '" height="' + Math.max(1, Math.abs(z - y(m.feeIncome))) + '" rx="3" class="cIn" opacity="' + (on ? 1 : .5) + '"/>';
        s += '<rect x="' + (x + 1) + '" y="' + Math.min(y(m.feeExpense), z) + '" width="' + bw + '" height="' + Math.max(1, Math.abs(z - y(m.feeExpense))) + '" rx="3" class="cOut" opacity="' + (on ? 1 : .5) + '"/>';
        pts.push([x, y(m.netProfit)]);
      } else pts.push([x, y(m.closing)]);
      s += '<text x="' + x + '" y="' + (H - 6) + '" font-size="10" text-anchor="middle" class="' + (on ? "cOn" : "cT") + '" font-weight="' + (on ? 700 : 400) + '">' + m.label.split(" ")[0] + '</text>';
    });
    var line = pts.map(function (p) { return p.join(","); }).join(" ");
    if (chartMode === "balance" && pts.length) {
      s += '<polygon points="' + pts[0][0] + ',' + y(Math.max(bot, 0)) + ' ' + line + ' ' + pts[pts.length - 1][0] + ',' + y(Math.max(bot, 0)) + '" class="cArea" opacity=".12"/>';
      if (pts.length > 1) s += '<polyline points="' + line + '" fill="none" class="cBal" stroke-width="2.5" stroke-linejoin="round"/>';
      pts.forEach(function (p) { s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3.5" class="cBalDot" stroke-width="2"/>'; });
    } else {
      if (pts.length > 1) s += '<polyline points="' + line + '" fill="none" class="cNet" stroke-width="2.5" stroke-linejoin="round"/>';
      pts.forEach(function (p) { s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3.5" class="cDot" stroke-width="2"/>'; });
    }
    $("chart").innerHTML = s;
    $("legend").innerHTML = chartMode === "profit"
      ? '<span><i style="background:var(--pos)"></i>Fee In</span><span><i style="background:var(--amber)"></i>Fee Out</span><span><i style="background:var(--indigo);height:3px"></i>Net Profit</span>'
      : '<span><i style="background:var(--accent2);height:3px"></i>Balance (end of month)</span>';
  }

  function card(label, value) {
    return '<div class="card"><div class="label">' + label + '</div><div class="value">' + value + '</div></div>';
  }

  function renderList() {
    if (!DATA) return;
    var q = $("search").value.trim().toLowerCase();
    var all = DATA.txns.concat(DATA.costs || []).filter(function (t) { return t.m === currentMonth; })
      .sort(function (a, b) { return a.k < b.k ? 1 : a.k > b.k ? -1 : 0; });          // newest first
    var items = all.filter(function (t) {
      if (typeFilter === "Deposit" || typeFilter === "Transfer" || typeFilter === "Cost") { if (t.t !== typeFilter) return false; }
      if (typeFilter === "Today" && t.d !== DATA.today) return false;
      if (q && String(t.n || "").toLowerCase().indexOf(q) === -1 && String(t.by || "").toLowerCase().indexOf(q) === -1) return false;
      return true;
    });

    var dep = 0, tra = 0, fee = 0, cost = 0;
    items.forEach(function (t) { if (t.t === "Deposit") dep += t.a; else if (t.t === "Cost") cost += t.a; else { tra += t.tt; fee += t.f; } });
    $("totals").textContent = items.length + " shown · Deposit " + fmt(dep) + " · Transfer " + fmt(tra) + " · Fee " + fmt(fee) +
      (cost ? " · Cost " + fmt(cost) : "");

    $("list").innerHTML = items.length ? items.map(function (t) {
      if (t.t === "Cost") return '<div class="item cost"><div><div class="desc">🧾 Fee (Expense)</div>' +
        '<div class="meta">' + esc(t.d) + (t.by ? ' · ' + esc(t.by) : '') + '</div></div>' +
        '<div class="amt neg">−' + fmt(t.a) + '</div></div>';
      var isDep = t.t === "Deposit";
      return '<div class="item ' + (isDep ? "dep" : "tra") + '">' +
        '<div><div class="desc">' + esc(t.n || "-") + '</div>' +
        '<div class="meta">' + esc(t.d) + ' · ' + t.t + (t.by ? ' · ' + esc(t.by) : '') + '</div></div>' +
        '<div class="amt ' + (isDep ? "pos" : "") + '">' + (isDep ? "+" : "−") + fmt(isDep ? t.a : t.tt) +
        (isDep ? "" : '<small>' + (t.f ? fmt(t.a) + ' + fee ' + fmt(t.f) : 'Free') + '</small>') + '</div></div>';
    }).join("") : '<div class="empty">មិនមានប្រតិបត្តិការ</div>';
  }

  function renderMonths() {
    var rows = DATA.year.filter(function (m) { return m.count > 0 || m.feeExpense > 0 || m.key === DATA.currentMonth; });
    var T = { deposit: 0, transfer: 0, feeIncome: 0, feeExpense: 0, netProfit: 0 };
    rows.forEach(function (m) { for (var k in T) T[k] += m[k]; });

    var html = rows.slice().reverse().map(function (m) {
      return '<div class="month' + (m.key === DATA.currentMonth ? " cur" : "") + '" data-key="' + m.key + '">' +
        '<div class="row1"><span>' + m.label + '</span>' + badge(m.status) + '</div>' +
        '<div class="row2">' +
          '<div>Deposit<b>' + fmt(m.deposit) + '</b></div>' +
          '<div>Transfer<b>' + fmt(m.transfer) + '</b></div>' +
          '<div>Balance<b>' + fmt(m.closing) + '</b></div>' +
          '<div>Fee In<b>' + fmt(m.feeIncome) + '</b></div>' +
          '<div>Fee Out<b>' + fmt(m.feeExpense) + '</b></div>' +
          '<div>Net Profit<b class="' + (m.netProfit >= 0 ? "pos" : "neg") + '">' + fmt(m.netProfit) + '</b></div>' +
        '</div></div>';
    }).join("");

    html += '<div class="month yeartotal"><div class="row1"><span>TOTAL</span>' +
      badge(T.netProfit >= 0 ? "Profit" : "Lose") + '</div><div class="row2">' +
      '<div>Deposit<b>' + fmt(T.deposit) + '</b></div>' +
      '<div>Transfer<b>' + fmt(T.transfer) + '</b></div>' +
      '<div>Net Profit<b>' + fmt(T.netProfit) + '</b></div>' +
      '<div>Fee In<b>' + fmt(T.feeIncome) + '</b></div>' +
      '<div>Fee Out<b>' + fmt(T.feeExpense) + '</b></div><div></div></div></div>';

    $("months").innerHTML = rows.length ? html : '<div class="empty">No data yet</div>';
    $("months").querySelectorAll(".month[data-key]").forEach(function (el) {
      el.onclick = function () { currentMonth = el.dataset.key; showTab("month"); render(); };
    });
  }

  function showTab(name) {
    document.querySelectorAll(".tab").forEach(function (t) { t.classList.toggle("on", t.dataset.tab === name); });
    $("tab-month").classList.toggle("hidden", name !== "month");
    $("tab-all").classList.toggle("hidden", name !== "all");
  }
  function setFilter(type) {
    typeFilter = type;
    $("typeFilters").querySelectorAll(".chip").forEach(function (c) { c.classList.toggle("on", c.dataset.type === type); });
  }
  document.querySelectorAll(".tab").forEach(function (t) { t.addEventListener("click", function () { showTab(t.dataset.tab); }); });
  $("typeFilters").addEventListener("click", function (e) {
    var b = e.target.closest(".chip"); if (!b) return; setFilter(b.dataset.type); renderList();
  });
  $("monthSel").onchange = function () { currentMonth = this.value; render(); };     // instant, no reload
  $("search").oninput = renderList;
  $("refresh").onclick = load;
  $("seg").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    chartMode = b.dataset.c;
    this.querySelectorAll("button").forEach(function (x) { x.classList.toggle("on", x === b); });
    if (DATA) renderChart();
  });

  // ---- colour circles: tap to change, remembered on this phone ----
  var THEMES = [["slate","#0F172A","#0F766E"],["navy","#123A6B","#1E40AF"],["emerald","#064E3B","#059669"],
                ["plum","#312E81","#7C3AED"],["cocoa","#4A2C17","#B45309"],["dark","#020617","#1F2937"]];
  var theme = ""; try { theme = localStorage.getItem("jmTheme") || ""; } catch (e) {}
  $("sw").innerHTML = THEMES.map(function (t) {
    return '<button data-t="' + t[0] + '" title="' + t[0] + '" style="background:linear-gradient(135deg,' + t[1] + ' 50%,' + t[2] + ' 50%)"></button>';
  }).join("");
  function applyTheme() {
    if (theme && theme !== "slate") document.documentElement.setAttribute("data-theme", theme);
    else if (theme === "slate") document.documentElement.setAttribute("data-theme", "slate");
    else document.documentElement.removeAttribute("data-theme");
    $("sw").querySelectorAll("button").forEach(function (b) { b.classList.toggle("on", b.dataset.t === (theme || "slate")); });
    var cs = getComputedStyle(document.documentElement);
    try { TG.setHeaderColor(cs.getPropertyValue("--head1").trim()); TG.setBackgroundColor(cs.getPropertyValue("--bg").trim()); } catch (e) {}
  }
  $("sw").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    theme = b.dataset.t; try { localStorage.setItem("jmTheme", theme); } catch (x) {}
    applyTheme();
  });
  applyTheme();
  load();
</script>
</body>
</html>
